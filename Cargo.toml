[package]
name = "rspamd-client"
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
homepage = "https://rspamd.com"
repository = "https://github.com/rspamd/rspamdclient-rs"
description = "Rspamd client API"
readme = "README.md"
categories = ["email"]
keywords = ["rspamd", "http"]
exclude = [".idea/"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
typed-builder = "0.23"
reqwest = { version = "0.13", optional = true, features = ["json", "rustls", "zstd"] }
zstd = "0.13"
tokio = { version = "1.52", optional = true, features = ["full"] }
maybe-async = "0.2"
async-trait = "0.1"
bytes = "1.12"
tokio-stream = { version = "0.1.18", optional = true }
attohttpc = { version = "0.31", optional = true }
native-tls = { version = "0.2", optional = true }
url = "2.5"
crypto_box = { version = "0.9", default-features = false, features = ["chacha20", "alloc", "getrandom"] }
rspamd-base32 = "0.1"
blake2b_simd = "1.0"
chacha20 = { version = "0.10", features = ["xchacha"] }
zeroize = "1"
curve25519-dalek = "5.0"
poly1305 = "0.9"
httparse = "1.10"

[features]
default = ["async"]
sync = ["attohttpc", "native-tls", "maybe-async/is_sync"]
async = ["reqwest", "tokio", "tokio-stream"]
